name: Build AP Controller (OpenWrt 25.12)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mesh-safe-wireless
      - feature/ap-config-discovery
    paths:
      - 'apcontroller/**'
      - 'luci-app-apcontroller/**'
      - '.github/workflows/build-openwrt-25.12.yml'

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check shell syntax
        run: |
          sh -n apcontroller/files/usr/share/apcontroller/apcontroller-agent
          sh -n apcontroller/files/usr/share/apcontroller/apcontroller-agent-config
          sh -n apcontroller/files/usr/bin/apcontroller-readconfig
          node --check luci-app-apcontroller/htdocs/luci-static/resources/view/apcontroller/apcontroller.js
          sh -n apcontroller/files/usr/share/apcontroller/apcontroller-agent-setconfig
          sh -n apcontroller/files/usr/bin/apcontroller-sendconfig
          sh -n apcontroller/files/usr/bin/apcontroller
          sh -n apcontroller/files/usr/libexec/rpcd/apcontroller
          sh -n apcontroller/files/etc/uci-defaults/apcontroller

      - name: Build packages with official OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_cortex-a53-25.12.0
          PACKAGES: apcontroller luci-app-apcontroller
          BUILD_LOG: 1

      - name: Store APK packages and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apcontroller-openwrt-25.12-aarch64-cortex-a53
          path: |
            bin/packages/**/*.apk
            logs/**
          if-no-files-found: warn
